name: "Sync2OSS"
description: "Sync files to Aliyun OSS with .NET 8"
author: "XingSora"

inputs:
  accessKeyId:
    description: "Aliyun AccessKeyId"
    required: true
  accessKeySecret:
    description: "Aliyun AccessKeySecret"
    required: true
  endpoint:
    description: "Aliyun Endpoint"
    required: true
  bucketName:
    description: "Aliyun BucketName"
    required: true
  fromRelease:
    description: "是否从Release上传"
    default: "true"
  repoUrl:
    description: "GitHub仓库地址"
    required: false
  isPre:
    description: "是否上传PreRelease"
    default: "false"
  keepCount:
    description: "保留最新几个版本"
    default: "2"
  remoteDir:
    description: "上传到远程目录"
    required: false
  addSymlink:
    description: "是否添加软链接"
    default: "false"
  localPath:
    description: "本地文件/文件夹路径（fromRelease为false时使用）"
    required: false
  region:
    description: "阿里云OSS区域"
    default: "cn-shanghai"

runs:
  using: "composite"
  steps:
    - name: Setup dotnet
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Build Project
      shell: bash
      run: |
        PROJECT_DIR="${{ github.workspace }}/src"
        
        dotnet restore "$PROJECT_DIR"
        dotnet build "$PROJECT_DIR" -c Release --nologo
        dotnet publish "$PROJECT_DIR" -c Release -o "$PROJECT_DIR/publish" --nologo
        
    - name: Run Sync2OSS
      shell: bash
      run: |

        if [ "$RUNNER_OS" = "Windows" ]; then
          EXE_PATH="${{ github.workspace }}/src/publish/sync2oss.exe"
          # 转换路径分隔符为Windows格式
          EXE_PATH=$(echo "$EXE_PATH" | sed 's/\//\\/g')
        else
          EXE_PATH="${{ github.workspace }}/src/publish/sync2oss"
        fi

        ARGS=(
          "--accessKeyId" "${{ inputs.accessKeyId }}"
          "--accessKeySecret" "${{ inputs.accessKeySecret }}"
          "--endpoint" "${{ inputs.endpoint }}"
          "--bucketName" "${{ inputs.bucketName }}"
          "--fromRelease" "${{ inputs.fromRelease }}"
          "--isPre" "${{ inputs.isPre }}"
          "--keepCount" "${{ inputs.keepCount }}"
          "--region" "${{ inputs.region }}"
        )


        [ -n "${{ inputs.repoUrl }}" ] && ARGS+=("--repoUrl" "${{ inputs.repoUrl }}")
        [ -n "${{ inputs.remoteDir }}" ] && ARGS+=("--remoteDir" "${{ inputs.remoteDir }}")
        [ -n "${{ inputs.localPath }}" ] && ARGS+=("--localPath" "${{ inputs.localPath }}")


        if [ "$RUNNER_OS" = "Windows" ]; then
          cmd.exe /C "call \"$EXE_PATH\"" "${ARGS[@]}"
        else
          chmod +x "$EXE_PATH"
          "$EXE_PATH" "${ARGS[@]}"
        fi
