name: "Vfiletransfer"
description: "Upload a local file to private Aliyun OSS and expose a signed download URL for later GitHub Actions steps"
author: "XingSora"
branding:
  icon: upload-cloud
  color: white

inputs:
  accessKeyId:
    description: "Aliyun AccessKeyId"
    required: true
  accessKeySecret:
    description: "Aliyun AccessKeySecret"
    required: true
  endpoint:
    description: "Aliyun OSS endpoint"
    required: true
  bucketName:
    description: "Aliyun OSS bucket name"
    required: true
  localPath:
    description: "Local file path to upload"
    required: true
  objectKey:
    description: "Target OSS object key; defaults to the uploaded file name"
    required: false
  expiresInSeconds:
    description: "Signed download URL validity in seconds"
    default: "3600"
    required: false
  overwrite:
    description: "Overwrite the remote object if it already exists"
    default: "true"
    required: false
  region:
    description: "Aliyun OSS region"
    default: "cn-shanghai"
    required: false

outputs:
  downloadUrl:
    description: "Signed download URL for the uploaded object"
    value: ${{ steps.run.outputs.downloadUrl }}
  signedUrl:
    description: "Alias of downloadUrl"
    value: ${{ steps.run.outputs.signedUrl }}
  objectKey:
    description: "Uploaded OSS object key"
    value: ${{ steps.run.outputs.objectKey }}
  ossUri:
    description: "Uploaded OSS URI"
    value: ${{ steps.run.outputs.ossUri }}

runs:
  using: "composite"
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Build Vfiletransfer
      shell: pwsh
      working-directory: ${{ github.action_path }}
      run: |
        $env:DOTNET_CLI_HOME = Join-Path (Get-Location) ".dotnet-cli"
        $env:NUGET_PACKAGES = Join-Path (Get-Location) ".nuget\packages"
        $restoreConfig = Join-Path (Get-Location) "NuGet.Config"

        dotnet restore ".\src\Sync2Oss.csproj" --configfile $restoreConfig
        dotnet build ".\src\Sync2Oss.csproj" -c Release --no-restore -o ".\src\build" --nologo

    - name: Run Vfiletransfer
      id: run
      shell: pwsh
      working-directory: ${{ github.action_path }}
      run: |
        $env:DOTNET_CLI_HOME = Join-Path (Get-Location) ".dotnet-cli"
        $dllPath = Join-Path (Get-Location) "src\build\Sync2Oss.dll"
        $arguments = @(
          $dllPath
          "--accessKeyId", "${{ inputs.accessKeyId }}"
          "--accessKeySecret", "${{ inputs.accessKeySecret }}"
          "--endpoint", "${{ inputs.endpoint }}"
          "--bucketName", "${{ inputs.bucketName }}"
          "--localPath", "${{ inputs.localPath }}"
          "--region", "${{ inputs.region }}"
          "--expiresInSeconds", "${{ inputs.expiresInSeconds }}"
          "--overwrite", "${{ inputs.overwrite }}"
        )

        if ("${{ inputs.objectKey }}") {
          $arguments += @("--objectKey", "${{ inputs.objectKey }}")
        }

        dotnet @arguments
